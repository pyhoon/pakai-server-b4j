<form hx-post="/hx/products" hx-target="#modal-messages" hx-swap="innerHTML">
  <div class="modal-header">
    <h5 class="modal-title">Add Product</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    <div id="modal-messages"></div>
    <div class="form-group">
      <label for="category1">Category 
        <span class="text-danger">*</span></label>
      <select class="form-select" id="category1" name="category" required></select>
    </div>
    <div class="form-group">
      <label>Code 
        <span class="text-danger">*</span></label>
      <input type="text" name="code" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Name 
        <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Price </label>
      <input type="text" name="price" class="form-control">
    </div>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-success px-3">Create</button>
    <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
  </div>
</form>
