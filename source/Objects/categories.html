<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Created using Pakai framework">
    <meta name="author" content="Aeric Poon">
    <title>$APP_TITLE$</title>
    <link rel="icon" type="image/png" href="$SERVER_URL$/assets/img/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="$SERVER_URL$/assets/css/main.css?v=$VERSION$">
</head>
<body class="bg-white">
    <div class="position-fixed end-0 p-3" style="z-index: 2000; bottom: 0%">
      <div id="toast-container" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body" id="toast-body">Operation successful!
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>
    <nav class="navbar navbar-light navbar-expand-lg sticky-top bg-info py-1">
      <div class="container-fluid">
        <a class="navbar-brand me-0 me-lg-2 pt-2" href="#">
          <i class="bi bi-infinity h3"></i></a>
        <a class="navbar-brand" href="$SERVER_URL$">$APP_TRADEMARK$</a>
        <button class="navbar-toggler d-md-block d-lg-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" style="border: none">
          <span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
          <ul class="navbar-nav navbar-brand ms-auto mb-md-0">
            <li class="nav-item d-block d-lg-none">
              <a class="nav-link float-end" href="https://paypal.me/aeric80/" target="_blank">
                <img src="/assets/img/coffee.png" class="my-1" style="height: 36px"></a></li>
            <li class="nav-item d-block d-lg-block">
              <a href="/" class="nav-link float-end">Home
                <i class="bi bi-house me-2" title="Home"></i></a></li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="text-center font-weight-bold d-none d-lg-block" style="background-color: whitesmoke">
      <a href="https://paypal.me/aeric80/" target="_blank">
        <img src="/assets/img/sponsor.png" class="mx-2" style="width: 174px"></a>
    </div>
    <div class="content m-3">
      <div class="p-2">
        <div class="row text-center align-items-center justify-content-center">
          <div>
            <h3 class="mb-0" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">$HOME_TITLE$</h3>
            <span class="small">Version: $VERSION$</span>
          </div>
        </div>
        <div class="row mt-3 text-center align-items-center justify-content-center">
          <div class="col-md-12 col-lg-6">
            <form class="form mb-3" action>
              <div class="row">
                <div class="col-md-6 col-lg-6 text-start">
                  <h3>CATEGORY LIST</h3>
                </div>
                <div class="col-md-6 col-lg-6">
                  <div class="text-end mt-2">
                    <button class="btn btn-success ml-2" hx-get="/hx/categories/add" hx-target="#modal-content" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#modal-container">
                      <i class="bi bi-plus-lg me-2"></i>Add Category</button>
                  </div>
                </div>
              </div>
            </form>
            <div id="categories-container" hx-get="/hx/categories/table" hx-trigger="load">Loading...
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="modal-container" class="modal fade" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>
    <div class="bottom"></div>
    <footer class="footer mt-auto py-3 bg-body-tertiary border-top">
      <div class="footer small text-center d-md-block" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">
        <caption>$APP_COPYRIGHT$
          <br>Made with 
          <span style="color: red">
            <i class="bi bi-heart"></i></span> powered by B4X
        </caption>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script src="$SERVER_URL$/assets/js/app.js"></script>
</body>
</html>
